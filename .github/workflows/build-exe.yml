name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 numpy opencv-python-headless pynput pywin32 pyinstaller

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import dcp_app, dcp_extras, dcp_extras2, dcp_refboard, dcp_instance, csp_companion, dcp_formats, dcp_hotkeys; print('ok', dcp_app.APP_VERSION)"

      - name: Version
        id: ver
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $v = (python -c "import dcp_core; print(dcp_core.APP_VERSION)").Trim()
          if (-not $v) { exit 1 }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name DynamicColorPicker --icon icon.ico `
            --add-data "icon.png;." `
            --add-data "RELEASE_NOTES.md;." `
            --hidden-import dcp_instance `
            --hidden-import dcp_extras `
            --hidden-import dcp_extras2 `
            --hidden-import dcp_refboard `
            --hidden-import PySide6.QtNetwork `
            --hidden-import pynput.keyboard._win32 `
            --hidden-import pynput.mouse._win32 `
            --hidden-import win32com.client `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module tkinter `
            dynamic_color_picker.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DMyVer=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish "latest" build (prerelease)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest dist/DynamicColorPicker.exe dist/DynamicColorPicker-Setup.exe `
            --title "Dynamic Color Picker — автосборка ${{ steps.ver.outputs.version }}" `
            --notes "Автосборка из коммита ${{ github.sha }}. Для обычного использования берите версионный релиз." `
            --target ${{ github.sha }} --prerelease

      - name: Publish versioned release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "dist/DynamicColorPicker-$tag.exe"
          $setup = "dist/DynamicColorPicker-Setup-$tag.exe"
          Copy-Item dist/DynamicColorPicker.exe $exe
          Copy-Item dist/DynamicColorPicker-Setup.exe $setup
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $setup --clobber
            gh release edit $tag --title "Dynamic Color Picker $tag" --notes-file RELEASE_NOTES.md --latest
          } else {
            gh release create $tag $exe $setup --title "Dynamic Color Picker $tag" --notes-file RELEASE_NOTES.md --latest
          }
